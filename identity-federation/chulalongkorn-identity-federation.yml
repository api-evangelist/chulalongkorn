  x-operator: federation
  tenant_id: 271d5e7b-1350-4b96-ab84-52dbda4cf40c
  tenant_region_scope: AS
  federation_brand_name: Chulalongkorn University
  namespace_type: Managed
  cloud_instance: microsoftonline.com
  domains:
  - chula.ac.th
  - student.chula.ac.th
  oidc:
    issuer: https://login.microsoftonline.com/271d5e7b-1350-4b96-ab84-52dbda4cf40c/v2.0
    discovery: https://login.microsoftonline.com/chula.ac.th/v2.0/.well-known/openid-configuration
    jwks_uri: https://login.microsoftonline.com/271d5e7b-1350-4b96-ab84-52dbda4cf40c/discovery/v2.0/keys
    probed: '2026-09-01'
    status: 200
    archived: identity-federation/chulalongkorn-entra-openid-configuration.json
  saml:
    entity_id: https://sts.windows.net/271d5e7b-1350-4b96-ab84-52dbda4cf40c/
    metadata: https://login.microsoftonline.com/271d5e7b-1350-4b96-ab84-52dbda4cf40c/federationmetadata/2007-06/federationmetadata.xml
    probed: '2026-09-01'
    status: 200
    archived: identity-federation/chulalongkorn-entra-saml-metadata.xml

campus_sso:
  name: Chula SSO
  x-operator: institution
  protocol: Modified CAS 1.0 with application authentication
  host: https://account.it.chula.ac.th/
  saml: false
  oidc: false
  note: >-
    Documented at https://account.it.chula.ac.th/wiki/doku.php?id=how_does_it_work (HTTP
    200). Backed by the university LDAP directory. It is institution-engineered — the wiki
    names the architect and the 2015 CU DataGateway project it came out of — but it is not
    a federation protocol implementation and contributes no SAML or Shibboleth conformance.
