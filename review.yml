  - date: '2026-06-03'
    rating: 2
    summary: >-
      Chulalongkorn University has a real but limited and largely gated public
      API footprint. Verified live: the official website, the IT department
      site, the Chula SSO wiki/docs, the CUIR institutional repository (now
      redirecting to Chula Digiverse on DSpace), and an official GitHub org.
      The Chula SSO API and CU Data Gateway API both require credentials/keys
      granted on request and are not self-service. The DSpace OAI-PMH and REST
      endpoints returned HTTP 500 to external probes and the Data Gateway
      portal did not resolve from outside the campus network, so those surfaces
      are noted honestly as documented-but-unconfirmed-live. No endpoints were
      fabricated; all API base/doc URLs derive from confirmed pages or standard
      DSpace conventions for this platform.
