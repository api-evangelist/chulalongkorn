---
aid: chulalongkorn
name: Chulalongkorn University
description: >-
  Chulalongkorn University is Thailand's oldest and a leading public research
  university, located in Bangkok and ranked #229 in the QS World University
  Rankings 2025. Its public developer/API footprint is limited and largely
  oriented toward identity and scholarly content: a campus single sign-on
  (Chula SSO) authentication API for student/staff login, an institutional
  repository (CUIR / Chula Digiverse, built on DSpace) exposing OAI-PMH and
  REST interfaces, and a staff-only central data exchange (CU Data Gateway)
  that offers an online API mode. There is no unified, openly documented
  public developer portal; access to most services is gated to university
  personnel or granted on request.
