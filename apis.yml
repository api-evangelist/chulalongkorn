x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated API surfaces were found, probed and contracted. Chula SSO
    (account.it.chula.ac.th, 161.200.194.26, no CNAME) documents /login, /logout and
    /serviceValidation with parameters, headers and JSON bodies on a public wiki, and the
    CU-REG Course Schedule backend (cas.reg.chula.ac.th/class/api) returns unauthenticated
    JSON for its curriculum register. Neither is published as a machine-readable contract by
    the university; both OpenAPIs here are API Evangelist work, marked derived and probed
    respectively, and neither is credited to the institution as something it published.

    The registrar API is honestly partial: thirteen of the fifteen endpoints its own client
    declares return 404 to an external unauthenticated caller, and that gap is recorded in
    the spec under x-client-declared-endpoints rather than papered over.

    One correction was made. The previous profile recorded the DigiVerse repository as a
    DSpace deployment exposing DSpace REST at /server/api and OAI-PMH — a claim that does
    not survive probing. DigiVerse is a PHP/AngularJS application and every one of those
    paths returns 404. The dead baseURL has been removed. The estate's only working OAI-PMH
    endpoint is at digital.car.chula.ac.th, which is a CNAME to dcchula.bepress.com with
    adminEmail dc-support@elsevier.com — a bepress Digital Commons tenancy, recorded as a
    tenant relationship rather than as a Chulalongkorn contract.

    Four surfaces are relationships rather than contracts and are recorded as such: a
    Microsoft Entra ID federation tenant, a DataCite consortium membership, eleven Crossref
    member records, and a ROR registration. None of their specifications is saved here and
    none of the relationships was deleted.

    What genuinely does not exist: no developer portal (api., developer., data. and
    opendata.chula.ac.th do not resolve), no open data portal, no llms.txt, no security.txt,
    no OpenAPI published by the university, no OAuth or OIDC authorization server offered to
    third parties, no self-service registration, no published rate limits, and no eduGAIN or
    Shibboleth presence. Three university hosts — www.chula.ac.th, www.it.chula.ac.th and
    lms.chula.ac.th — sit behind Imperva and answer a 212-byte Incapsula challenge to
    non-browser clients even with full browser headers; that is a limit on our probe, not a
    finding about the university, and those hosts are graded live.
