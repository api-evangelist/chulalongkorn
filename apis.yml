apis:
- aid: chulalongkorn:sso
  name: Chula SSO Authentication API
  description: >-
    The university's own single sign-on service, in production at account.it.chula.ac.th
    since January 2017 and originally built as part of the 2015 CU DataGateway project. The
    protocol is a modified CAS 1.0 flow with an application-authentication step layered on
    top: a relying application presents a DeeAppId / DeeAppSecret pair alongside the user's
    ticket, so the SSO controls which applications may authenticate a Chula ID, and users
    never hand credentials to the relying application. The public wiki documents /login,
    /logout and /serviceValidation with their parameters, headers and JSON response bodies —
    unusually complete prose for this cohort. What it does not do is publish a
    machine-readable contract or offer self-service registration: keys are requested by
    email from the architect named on the wiki. The OpenAPI recorded here is an API
    Evangelist transcription of that page, marked derived, not something the university
    published.
  humanURL: https://account.it.chula.ac.th/wiki/doku.php
