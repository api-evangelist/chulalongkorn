---
aid: chulalongkorn
name: Chulalongkorn University
description: >-
  Chulalongkorn University is Thailand's oldest public research university, founded in 1917
  in Bangkok. Its programmable footprint is small, real, and almost entirely undeclared:
  there is no developer portal, no open data portal, no published specification of any
  kind, and no self-service registration anywhere in the estate. What it does operate are
  two genuine institution-run surfaces. Chula SSO at account.it.chula.ac.th has been in
  production since January 2017 and is documented endpoint-by-endpoint on a public wiki — a
  modified CAS 1.0 protocol with an added application-authentication step, backed by the
  university LDAP directory, with keys issued by email rather than by a console. The Office
  of the Registrar's CU-REG Course Schedule application answers unauthenticated JSON at
  cas.reg.chula.ac.th/class/api for its curriculum register and build version, though the
  thirteen further endpoints its own client declares return 404 from outside the campus
  network. Everything else that looks like a Chulalongkorn API belongs to somebody else:
  Chula Digital Collections, which serves the university's only working OAI-PMH endpoint,
  is a bepress Digital Commons tenancy (digital.car.chula.ac.th is a CNAME to
  dcchula.bepress.com, adminEmail dc-support@elsevier.com); federated login is a Microsoft
  Entra ID tenant; DOIs are registered through DataCite and, faculty by faculty, through
  eleven separate Crossref member records. The institution's own DigiVerse repository
  publishes no machine-readable interface at all, and the previously recorded claim that it
  is a DSpace deployment exposing DSpace REST and OAI-PMH does not survive probing. The
  central data exchange, CU Data Gateway, is restricted to assigned university personnel and
  unreachable from outside the campus network.
