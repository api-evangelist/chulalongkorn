- aid: chulalongkorn:course-schedule
  name: CU-REG Course Schedule API
  description: >-
    The read-only JSON backend behind CU-REG Course Schedule, the Office of the Registrar's
    public course, curriculum and timetable browser. Two endpoints answer HTTP 200 to an
    unauthenticated request from outside the campus network — /course-studies, which returns
    the curriculum register with degree and major names in Thai and English, credit totals
    and offering windows, and /version. The Angular client declares thirteen further
    endpoints against the same base (/course, /course-detail, /faculty, /instructor,
    /exam-date and others); all thirteen returned 404 on probe, and they are recorded as
    observations in the OpenAPI rather than promoted to a contract that cannot be
    demonstrated. No key, no token, no published rate limit, no terms of use. A bare GET on the base
    /class/api issues a 301 to http://cas.reg.chula.ac.th:8080/class/api/, leaking the
    origin port and downgrading to plain HTTP.
  humanURL: https://cas.reg.chula.ac.th/class/course-schedule
